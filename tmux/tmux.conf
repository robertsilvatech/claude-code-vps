# ~/.config/tmux/tmux.conf — instalado pelo claude-code-vps
#
# Pra quê: manter o `claude` (ou qualquer coisa longa) vivo quando o SSH cai.
#   cc session-name          # cria OU volta pra sessão já rodando o claude; cc lista
#   tmux new -A -s claude   # o mesmo, sem alias (sem a função cc)
#   Ctrl-b d                # desconecta — a sessão continua rodando no servidor
#   tmux ls                 # lista sessões
#   Ctrl-b r                # recarrega este arquivo

# --- terminal / cores (tmux-256color se o terminfo existir, senão screen-256color)
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 10          # Esc responde na hora (TUIs como o claude)
set -g focus-events on
set -g set-clipboard on

# --- comportamento
set -g mouse on                # scroll, clicar em pane, redimensionar
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g window-size latest     # iPhone e Mac na mesma sessão: o tamanho segue o último cliente ativo
setw -g aggressive-resize on

# --- atalhos
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- status bar discreta
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold]#S  "
set -g status-left-length 20
set -g status-right "#h  %d/%m %H:%M"
setw -g window-status-current-style "fg=colour255,bold"
